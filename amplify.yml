version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - corepack enable
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run typecheck
        - pnpm run build
        - test -f build/client/index.html
        - test -f build/client/docs/index.html
        - test -f build/client/help/index.html
        - test -f build/client/changelog/index.html
  artifacts:
    baseDirectory: build/client
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
